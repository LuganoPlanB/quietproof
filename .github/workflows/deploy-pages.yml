name: Deploy website to GitHub Pages

on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful main-branch Tests run whose checked artifact should be deployed
        required: true
        type: string

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    outputs:
      deploy: ${{ steps.source.outputs.deploy }}
    steps:
      - name: Verify source run and skip superseded commits
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
        run: |
          python3 - <<'PYTHON'
          import json, os, subprocess
          repository = os.environ['GITHUB_REPOSITORY']
          run_id = os.environ['RUN_ID']
          if not run_id.isdigit():
              raise SystemExit('Expected a numeric Tests run ID')
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', f'repos/{repository}/{path}']))
          run = api(f'actions/runs/{run_id}')
          assert run['path'] == '.github/workflows/test.yml'
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          assert run['event'] == 'push' and run['head_branch'] == 'main'
          assert run['head_repository']['full_name'].lower() == repository.lower()
          current = api('git/ref/heads/main')['object']['sha']
          deploy = run['head_sha'] == current
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'run_id={run_id}\nsha={run["head_sha"]}\ndeploy={str(deploy).lower()}\n')
          print('Deploying checked artifact' if deploy else 'Skipping superseded main commit')
          PYTHON
      - name: Configure GitHub Pages
        id: pages
        if: steps.source.outputs.deploy == 'true'
        uses: actions/configure-pages@v5
      - uses: actions/checkout@v7
        if: steps.source.outputs.deploy == 'true'
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false
      - name: Download the exact artifact from successful main CI
        if: steps.source.outputs.deploy == 'true'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run_id }}
          name: quietproof-static
          path: checked-site
      - name: Verify artifact identity, base and qualification scope
        if: steps.source.outputs.deploy == 'true'
        env:
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
          EXPECTED_BASE: ${{ steps.pages.outputs.base_path }}/
        run: python3 scripts/check_pages_artifact.py checked-site "$EXPECTED_SHA" "$EXPECTED_BASE"
      - name: Upload checked GitHub Pages artifact
        if: steps.source.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: checked-site

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
