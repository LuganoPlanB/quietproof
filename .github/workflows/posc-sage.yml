name: PoKC and PoSC Sage references

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: posc-sage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reference:
    name: PoKC and PoSC Sage/C++ fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          path: quietproof
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: dyne/longfellow-zk
          ref: d2b0fc515f8663e38c79a28e8900ce8438e0106e
          path: longfellow-zk
          persist-credentials: false
      - name: Generate fresh PoKC and PoSC Sage vectors and check committed fixtures
        working-directory: quietproof
        run: |
          mkdir -p "$RUNNER_TEMP/posc"
          bash scripts/run_pokc_sage.sh
          bash scripts/run_pokc_sage.sh --emit > "$RUNNER_TEMP/posc/pokc_sage_vectors.json"
          cmp tests/quietproof/testdata/pokc_sage_vectors.json "$RUNNER_TEMP/posc/pokc_sage_vectors.json"
          python3 scripts/run_posc_sage.py
          python3 scripts/run_posc_sage.py --emit > "$RUNNER_TEMP/posc/posc_sage_vectors.json"
          cmp tests/quietproof/testdata/posc_sage_vectors.json "$RUNNER_TEMP/posc/posc_sage_vectors.json"
          python3 tests/quietproof/posc_reference_contract_test.py
      - name: Build PoKC and composed PoSC C++ fixture evaluators
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y g++ cmake ninja-build python3
          cmake -S longfellow-zk -B sdk-build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF -DLONGFELLOW_ZK_BUILD_TESTING=OFF -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/sdk-prefix"
          cmake --build sdk-build --parallel 2
          cmake --install sdk-build
          cmake -S quietproof -B posc-build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/sdk-prefix" -DBUILD_TESTING=ON \
            -DQUIETPROOF_BUILD_RPC=OFF -DQUIETPROOF_BUILD_SIGNATURE_MODE=ON
          cmake --build posc-build --target quietproof-ecdsa-circuit-test pokc-sage-test --parallel 2
      - name: Match PoKC Sage fixtures with C++ native and circuit evaluation
        run: >-
          ctest --test-dir posc-build -R '^pokc-sage-test$' --output-on-failure --no-tests=error
          --output-junit "$RUNNER_TEMP/posc/pokc-sage.xml" | tee "$RUNNER_TEMP/posc/pokc-constraints.log"
      - name: Compare fresh Sage with Python and actual C++ assertions
        working-directory: quietproof
        run: |
          python3 tests/quietproof/posc_sage_vector_test.py \
            --fixture "$RUNNER_TEMP/posc/posc_sage_vectors.json" \
            --circuit ../posc-build/quietproof-ecdsa-circuit-test | tee "$RUNNER_TEMP/posc/constraints.log"
      - name: Retain independent public model output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quietproof-sage-vectors
          path: ${{ runner.temp }}/posc
          if-no-files-found: error
